services:
  db:
    image: pgvector/pgvector:pg17
    container_name: enterprise-ai-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: ai_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_admin -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: